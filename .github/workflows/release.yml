name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release-snapshot:
    if: github.event_name == 'pull_request'
    name: Release Snapshot
    concurrency:
      group: docker-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: stg
      APP_NAME: issuer-enterprise
      REGION_CODE: ew1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradlew Executable
        working-directory: altia-eudistack-issuer-enterprise-backend
        run: chmod +x ./gradlew

      - name: Get Project Version
        working-directory: altia-eudistack-issuer-enterprise-backend
        run: echo "VERSION=$(./gradlew -q properties | grep '^version:' | awk '{print $2}')" >> $GITHUB_ENV

      - name: Compute PR-based snapshot suffix
        run: echo "SNAPSHOT_SUFFIX=-pr-${{ github.event.number }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push docker image (ECR)
        env:
          VERSION: ${{ env.VERSION }}
          SNAPSHOT_SUFFIX: ${{ env.SNAPSHOT_SUFFIX }}
          ECR_REPOSITORY: eudistack-${{ env.ENVIRONMENT }}-ecr-${{ env.REGION_CODE }}-${{ env.APP_NAME }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}${SNAPSHOT_SUFFIX}-enterprise"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

          docker build -f altia-eudistack-issuer-enterprise-backend/Dockerfile --build-arg SKIP_TESTS=true -t "${ECR_IMAGE}" altia-eudistack-issuer-enterprise-backend
          docker push "${ECR_IMAGE}"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Release
    runs-on: ubuntu-latest
    environment: stg
    env:
      ENVIRONMENT: stg
      APP_NAME: issuer-enterprise
      REGION_CODE: ew1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make Gradlew Executable
        working-directory: altia-eudistack-issuer-enterprise-backend
        run: chmod +x ./gradlew

      - name: Get Project Version
        working-directory: altia-eudistack-issuer-enterprise-backend
        run: echo "VERSION=$(./gradlew -q properties | grep '^version:' | awk '{print $2}')" >> $GITHUB_ENV

      - name: Check if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "::notice::Release v${VERSION} already exists — skipping."
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        if: env.SKIP_RELEASE != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.SKIP_RELEASE != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push docker image (ECR)
        if: env.SKIP_RELEASE != 'true'
        env:
          VERSION: ${{ env.VERSION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: eudistack-${{ env.ENVIRONMENT }}-ecr-${{ env.REGION_CODE }}-${{ env.APP_NAME }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          ECR_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker build -f altia-eudistack-issuer-enterprise-backend/Dockerfile --build-arg SKIP_TESTS=true -t "${ECR_IMAGE}" altia-eudistack-issuer-enterprise-backend

          docker tag "${ECR_IMAGE}" "${ECR_LATEST}"

          docker push "${ECR_IMAGE}"
          docker push "${ECR_LATEST}"

      - name: Generate CycloneDX SBOM
        if: env.SKIP_RELEASE != 'true'
        working-directory: altia-eudistack-issuer-enterprise-backend
        run: ./gradlew cyclonedxBom

      - name: Validate the published SBOM
        if: env.SKIP_RELEASE != 'true'
        run: node .github/scripts/license-gate.mjs --sbom-path altia-eudistack-issuer-enterprise-backend/build/reports/sbom/sbom.json --expect-version ${{ env.VERSION }}

      - name: Prepare SBOM Release Asset
        if: env.SKIP_RELEASE != 'true'
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          cp altia-eudistack-issuer-enterprise-backend/build/reports/sbom/sbom.json "./sbom-${TAG}.cdx.json"

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          gh release create "${TAG}" \
            "./sbom-${TAG}.cdx.json#CycloneDX SBOM (${TAG})" \
            --title "${TAG}" \
            --notes "Release of version ${TAG}" \
            --target main

      - name: Trigger deploy to STG
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml -f environment=stg
          echo "### Deploy triggered" >> $GITHUB_STEP_SUMMARY

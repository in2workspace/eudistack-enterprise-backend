logging:
  level:
    es.altia: DEBUG

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
      base-path: /
      path-mapping:
        health: health
  endpoint:
    health:
      enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
app:
  signing:
    provider: in-memory
    coreUrl: https://issuer.dummy.eudistack.net
  remote-signature:
    certificate-info-cache-ttl: PT10M
    type: type
    url: https://remote-signature.dummy.eudistack.net
    paths:
      sign-path: "/signature/sign"
    client-id: client-id
    client-secret: client-secret
    credential-id: credential-id
    credential-password: credential-password
  data-acquisition:
    sources:
      - credential-configuration-id: "LEARCredentialEmployee"
        type: mock
        endpoint: "ldaps://ldap.acme.com:636"
        base-dn: "ou=employees,dc=acme,dc=com"
        bind-dn: "cn=issuer,dc=acme,dc=com"
        bind-password: "${LDAP_PASSWORD}"
        subject-identifier-attribute: "employeeNumber"
        mapping:
          first_name: "givenName"
          family_name: "sn"
          email: "mail"
          employee_id: "employeeNumber"
        timeout: 30s
        retry:
          max-attempts: 3
          backoff: 1s

  issuer-core-backend:
    url: https://issuer.red.eudistack.net
spring:
  profiles:
    active: dev
signing:
  provider: in-memory
  coreUrl: https://issuer.dummy.eudistack.net
remote-signature:
  certificate-info-cache-ttl: PT10M
  # The type of the remote signature service (REQUIRED)
  type: type
  # The URL of the remote signature service (REQUIRED)
  url: https://remote-signature.dummy.eudistack.net
  paths:
    sign-path: "/signature/sign"
  # The client ID used for remote signature (REQUIRED)
  client-id: client-id
  # The client secret used for remote signature (REQUIRED)
  client-secret: client-secret
  # The credential ID used for remote signature (REQUIRED)
  credential-id: credential-id
  # The credential password used for remote signature (REQUIRED)
  credential-password: credential-password
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
      base-path: /
      path-mapping:
        health: health
  endpoint:
    health:
      enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
spring:
  profiles:
    active: dev

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
      base-path: /
      path-mapping:
        health: health
  endpoint:
    health:
      enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
app:
  signing:
    provider: in-memory
    coreUrl: https://issuer.dummy.eudistack.net
  remote-signature:
    certificate-info-cache-ttl: PT10M
    type: type
    url: https://remote-signature.dummy.eudistack.net
    paths:
      sign-path: "/signature/sign"
    client-id: client-id
    client-secret: client-secret
    credential-id: credential-id
    credential-password: credential-password

spring:
  application:
    name: altia-eudistack-issuer-enterprise-backend
  http:
    converters:
      # Spring Boot 4 defaults HTTP message conversion to Jackson 3 (tools.jackson.*); this
      # codebase's DTOs still use Jackson 2 types (com.fasterxml.jackson.databind.JsonNode,
      # ObjectMapper), so both MVC and RestClient must serialize/deserialize with Jackson 2.
      preferred-json-mapper: jackson2

logging:
  level:
    es.altia: INFO

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
      base-path: /
      path-mapping:
        health: health
  endpoint:
    health:
      enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
app:
  data-acquisition:
    sources:
      - credential-configuration-id:
        type:
        endpoint:
        base-dn:
        bind-dn:
        bind-password:
        subject-identifier-attribute:
        mapping:
          first_name:
          family_name:
          email:
          employee_id:
        timeout: 30s
        retry:
          max-attempts: 3
          backoff: 1s
  issuer-core-backend:
    url:

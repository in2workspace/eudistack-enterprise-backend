spring:
  application:
    name: altia-eudistack-issuer-enterprise-backend
logging:
  level:
    es.altia: INFO
signing:
  url:
  provider: csc-sign-doc   # csc-sign-hash / csc-sign-doc / in-memory
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
      base-path: /
      path-mapping:
        health: health
  endpoint:
    health:
      enabled: true
      show-details: always
  tracing:
    sampling:
      probability: 1.0
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.cyclonedx.bom' version '2.2.0'
    id 'org.owasp.dependencycheck' version '12.2.0'
    id 'org.sonarqube' version '7.2.2.6593'
}

group = 'es.altia'
version = '0.4.1'

jacoco {
    toolVersion = "0.8.14"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT claims decoding (EUD-226 T30/T31 — unsigned payload decode only, see CallerIdentityResolver)
    implementation 'com.nimbusds:nimbus-jose-jwt:9.40'

    // DevTools
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Unit Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // Observability
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
}

cyclonedxBom {
    includeConfigs = ['runtimeClasspath']
    schemaVersion = '1.6'
    destination = project.file('build/reports/sbom')
    outputName = 'sbom'
    outputFormat = 'json'
    includeBomSerialNumber = false
    includeLicenseText = false
}

tasks.named('test', Test) {
    useJUnitPlatform()
    finalizedBy(tasks.jacocoTestReport)
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.test

    reports {
        xml.required.set(true)
        csv.required.set(false)
        html.outputLocation.set(layout.buildDirectory.dir("jacocoHtml"))
    }

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                "**/*Application.class"
        ])
    }))
}


// --- Quality & CI ---

sonar {
    properties {
        property 'sonar.projectKey', 'in2workspace_eudistack-enterprise-backend'
        property 'sonar.organization', 'in2workspace'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sources', 'src/main/java,src/main/resources'
        property 'sonar.exclusions', 'src/main/resources/**/*.sql'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.coverage.exclusions',
                "src/main/java/**/AltiaEudistackIssuerEnterpriseBackendApplication.java, " +
                        "src/main/java/**/SecurityConfig.java"
    }
}
